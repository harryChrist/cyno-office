name: Bug
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Obrigado por relatar. Falha de segurança não vai aqui: veja o SECURITY.md.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão ou commit
      description: Saída de `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: como-roda
    attributes:
      label: Como você roda o Cyno
      options:
        - Desenvolvimento (npm run dev)
        - pm2
        - Docker
        - Laboratório (npm run lab:up)
    validations:
      required: true
  - type: input
    id: motor
    attributes:
      label: Motor do agente
      description: Por exemplo Claude Code, Antigravity, Codex, OpenCode, OpenClaw, Hermes.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Cole só o trecho relevante, **sem segredos** (senhas, tokens, códigos de configuração, IPs).
      render: shell
