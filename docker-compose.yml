# docker compose up -d --build   ->   http://localhost:3067
services:
  cyno:
    build: .
    image: cyno:local
    container_name: cyno
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3067}:${WEB_PORT:-3067}"   # só o web; o server fica em 127.0.0.1 dentro do contêiner
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      # pastas do próprio projeto (ambas fora do git e da imagem: .gitignore e .dockerignore)
      - ./data:/data              # workspaces, projetos, senha (auth.json)
      - ./data-home:/home/node    # logins das CLIs (~/.claude, ~/.claude.json, ~/.codex...)
